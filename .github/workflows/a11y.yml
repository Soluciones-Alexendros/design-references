name: a11y

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  a11y:
    name: contrast + axe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate DTCG tokens
        run: npm run validate:tokens

      - name: Build package (CSS + types)
        run: npm run build -w @soluciones-alexendros/ds

      - name: Contrast runner
        run: npm run test:contrast -w @soluciones-alexendros/ds

      - name: Token-only lint (primitives)
        run: npm run lint:tokens-only -w @soluciones-alexendros/ds

      - name: axe smoke (jsdom light + dark)
        run: npm run test:a11y:smoke -w @soluciones-alexendros/ds

      - name: axe Playwright (themes × brands × media + reflow)
        run: npm run test:a11y -w @soluciones-alexendros/ds

      - name: Theme-boot smoke
        run: npm run test:theme -w @soluciones-alexendros/ds
